<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0cea0"/>
      <stop offset=".34" stop-color="#c9945d"/>
      <stop offset=".7" stop-color="#9a6539"/>
      <stop offset="1" stop-color="#e0b77f"/>
    </linearGradient>
    <linearGradient id="metalBright" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0c6"/>
      <stop offset="1" stop-color="#b77942"/>
    </linearGradient>
    <radialGradient id="hub" cx="44%" cy="38%" r="66%">
      <stop offset="0" stop-color="#211710"/>
      <stop offset=".7" stop-color="#090706"/>
      <stop offset="1" stop-color="#040302"/>
    </radialGradient>
  </defs>

  <!-- Transparent cage: the CSS layer underneath supplies the changing tape pack. -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#metal)" stroke-width="6.2"/>
  <circle cx="50" cy="50" r="36.2" fill="none" stroke="#382517" stroke-width="2.2"/>

  <!-- Full radial reel cage rotates as one mechanism. -->
  <g fill="url(#metal)" stroke="#6f492b" stroke-width=".9">
    <rect x="46.2" y="8" width="7.6" height="28" rx="2.1"/>
    <rect x="46.2" y="8" width="7.6" height="28" rx="2.1" transform="rotate(45 50 50)"/>
    <rect x="46.2" y="8" width="7.6" height="28" rx="2.1" transform="rotate(90 50 50)"/>
    <rect x="46.2" y="8" width="7.6" height="28" rx="2.1" transform="rotate(135 50 50)"/>
    <rect x="46.2" y="8" width="7.6" height="28" rx="2.1" transform="rotate(180 50 50)"/>
    <rect x="46.2" y="8" width="7.6" height="28" rx="2.1" transform="rotate(225 50 50)"/>
    <rect x="46.2" y="8" width="7.6" height="28" rx="2.1" transform="rotate(270 50 50)"/>
    <rect x="46.2" y="8" width="7.6" height="28" rx="2.1" transform="rotate(315 50 50)"/>
  </g>

  <!-- Inner ring and drive hub stay mechanically attached to the cage. -->
  <circle cx="50" cy="50" r="27.2" fill="none" stroke="#d2a16a" stroke-width="3"/>
  <circle cx="50" cy="50" r="21.5" fill="none" stroke="#5d3b22" stroke-width="3.6"/>
  <circle cx="50" cy="50" r="16.6" fill="url(#hub)" stroke="url(#metal)" stroke-width="3.2"/>

  <g fill="#c18d55" stroke="#6e472a" stroke-width=".7">
    <rect x="47.3" y="31.2" width="5.4" height="8.4" rx="1.2"/>
    <rect x="47.3" y="31.2" width="5.4" height="8.4" rx="1.2" transform="rotate(60 50 50)"/>
    <rect x="47.3" y="31.2" width="5.4" height="8.4" rx="1.2" transform="rotate(120 50 50)"/>
    <rect x="47.3" y="31.2" width="5.4" height="8.4" rx="1.2" transform="rotate(180 50 50)"/>
    <rect x="47.3" y="31.2" width="5.4" height="8.4" rx="1.2" transform="rotate(240 50 50)"/>
    <rect x="47.3" y="31.2" width="5.4" height="8.4" rx="1.2" transform="rotate(300 50 50)"/>
  </g>
  <circle cx="50" cy="50" r="8.5" fill="#050403" stroke="#6f4b2e" stroke-width="1.6"/>
  <circle cx="47.2" cy="46.8" r="2.2" fill="#e7c089" fill-opacity=".62"/>

  <!-- Asymmetric highlights make actual rotation readable without a marker/cross. -->
  <path d="M47.2 8.2h5.6v18.5h-5.6z" fill="url(#metalBright)" opacity=".82"/>
  <path d="M76.6 19.8A42 42 0 0 1 86.8 32" fill="none" stroke="#f2c78e" stroke-width="2.4" stroke-linecap="round" opacity=".72"/>
  <path d="M18.7 73.5A42 42 0 0 1 13.3 61" fill="none" stroke="#694023" stroke-width="2.8" stroke-linecap="round" opacity=".72"/>
</svg>
