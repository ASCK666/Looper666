name: Quick Looper render

on:
  pull_request:
    branches:
      - fix/surgical-faceplate-digital-cleanup

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Python only
        run: python -m pip install --disable-pip-version-check playwright
      - name: Render Looper with system Chrome
        run: |
          mkdir -p test-artifacts
          python - <<'PY'
          from pathlib import Path
          import http.server, socketserver, threading
          from playwright.sync_api import sync_playwright

          root=Path('.').resolve()
          class Quiet(http.server.SimpleHTTPRequestHandler):
              def log_message(self,*_): pass
          handler=lambda *a,**kw: Quiet(*a,directory=str(root),**kw)
          server=socketserver.TCPServer(('127.0.0.1',0),handler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          try:
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True,channel='chrome',args=['--no-sandbox','--disable-dev-shm-usage'])
                  page=browser.new_page(viewport={'width':1536,'height':1150},device_scale_factor=1)
                  page.goto(f'http://127.0.0.1:{server.server_address[1]}/index.html',wait_until='networkidle',timeout=30000)
                  page.wait_for_function('window.__SP && window.__SP.ready === true',timeout=10000)
                  page.wait_for_function("document.querySelector('.looper-faceplate')?.naturalWidth === 1536",timeout=10000)
                  page.locator('#looper').screenshot(path='test-artifacts/looper-cassette-label.png')
                  browser.close()
          finally:
              server.shutdown(); server.server_close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: quick-looper-render-cassette-label
          path: test-artifacts/looper-cassette-label.png
          if-no-files-found: error
