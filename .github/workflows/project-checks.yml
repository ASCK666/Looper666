name: Project checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run maintained checks
        run: python tools/test_all.py

      - name: Commit CSS cleanup candidate
        if: failure() && github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- css/base.css; then
            git fetch origin "${{ github.head_ref }}"
            git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add css/base.css
            git commit -m "Remove shadowed CSS declarations"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
