name: Project checks

on:
  push:
    branches:
      - main
      - agent/remove-drum-library-meter
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply surgical drum cleanup
        if: github.ref == 'refs/heads/agent/remove-drum-library-meter' || github.head_ref == 'agent/remove-drum-library-meter'
        run: python tools/temp_drum_cleanup.py

      - name: Install browser test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run maintained checks
        run: python tools/test_all.py

      - name: Commit clean final tree
        if: github.ref == 'refs/heads/agent/remove-drum-library-meter' || github.head_ref == 'agent/remove-drum-library-meter'
        run: |
          git diff --check
          git checkout origin/main -- .github/workflows/project-checks.yml
          git rm -f .github/workflows/temp-drum-cleanup.yml tools/temp_drum_cleanup.py
          git add index.html js/core.js js/drums.js js/events.js css/base.css tests/drum_ui.py tests/punch_master.py .github/workflows/project-checks.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove redundant drum library panel and meter"
          git push origin HEAD:agent/remove-drum-library-meter
