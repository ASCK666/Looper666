name: One-shot AUTO markup cleanup

on:
  push:
    branches:
      - agent/looper-deck-refactor
    paths:
      - .github/workflows/one-shot-auto-markup-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/looper-deck-refactor
          fetch-depth: 0

      - name: Remove obsolete AUTO status markup
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = '<span aria-hidden="true">+1</span><strong>AUTO SPEED</strong><small id="autoLooperCompactStatus">OFF • +1% / 8 LOOPS</small>'
          new = '<span aria-hidden="true">+1</span><strong>AUTO SPEED</strong>'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one AUTO bridge markup fragment, found {text.count(old)}")
          text = text.replace(old, new, 1)
          if "autoLooperCompactStatus" in text:
              raise SystemExit("autoLooperCompactStatus still present in index.html")
          path.write_text(text, encoding="utf-8")

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "remove obsolete auto status markup"
          git push origin HEAD:agent/looper-deck-refactor
