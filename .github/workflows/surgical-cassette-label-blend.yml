name: Surgical cassette label blend

on:
  push:
    branches:
      - fix/html-transparent-readouts

permissions:
  contents: write

jobs:
  blend:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/html-transparent-readouts
          fetch-depth: 0
      - name: Blend cassette title patch into existing paper band
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('assets/looper-ui/overlay.css')
          text=path.read_text()
          replacements={
            '  color:#24170d;':'  color:#17100b;',
            '  background-image:radial-gradient(circle at 12% 31%,rgba(255,255,255,.18) 0 .45px,transparent .7px),radial-gradient(circle at 66% 71%,rgba(94,68,42,.08) 0 .55px,transparent .8px),linear-gradient(180deg,#e5d4b9 0%,#dec8a7 50%,#d9c19f 100%);':
            '  background-image:radial-gradient(circle at 12% 31%,rgba(255,255,255,.10) 0 .45px,transparent .7px),radial-gradient(circle at 66% 71%,rgba(74,50,32,.07) 0 .55px,transparent .8px),linear-gradient(90deg,#d1ae8b 0%,#b89c86 48%,#c3a389 70%,#e1b489 100%);'
          }
          for old,new in replacements.items():
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'Expected one match, found {count}: {old!r}')
              text=text.replace(old,new,1)
          path.write_text(text)
          PY
      - name: Assert faceplate untouched
        run: git diff --exit-code HEAD -- assets/looper-ui/faceplate.webp
      - name: Remove temporary workflow and commit CSS only
        run: |
          rm .github/workflows/surgical-cassette-label-blend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/looper-ui/overlay.css .github/workflows/surgical-cassette-label-blend.yml
          git commit -m "Blend cassette HTML title into faceplate label"
          git push origin HEAD:fix/html-transparent-readouts
