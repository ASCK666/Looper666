name: Quick asset render

on:
  pull_request:
    branches:
      - fix/html-transparent-readouts

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Run asset render regression
        run: python tests/asset_render.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-render
          path: test-artifacts/*.png
