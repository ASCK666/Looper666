name: Surgical cassette center repair

on:
  push:
    branches:
      - fix/surgical-faceplate-digital-cleanup

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/surgical-faceplate-digital-cleanup
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless

      - name: Blend center hole into cassette plastic
        run: |
          python - <<'PY'
          from pathlib import Path
          import cv2
          import numpy as np
          from PIL import Image

          path = Path('assets/looper-ui/faceplate.webp')
          original = np.array(Image.open(path).convert('RGB'))
          if original.shape != (1024, 1536, 3):
              raise SystemExit(f'Unexpected faceplate dimensions: {original.shape}')

          allowed = np.zeros(original.shape[:2], dtype=np.uint8)
          cv2.rectangle(allowed, (699, 219), (836, 289), 255, -1)

          bgr = cv2.cvtColor(original, cv2.COLOR_RGB2BGR)
          repaired_bgr = cv2.inpaint(bgr, allowed, 10, cv2.INPAINT_TELEA)
          repaired = cv2.cvtColor(repaired_bgr, cv2.COLOR_BGR2RGB)
          repaired[allowed == 0] = original[allowed == 0]

          Image.fromarray(repaired).save(path, 'WEBP', lossless=True, quality=100, method=6)
          roundtrip = np.array(Image.open(path).convert('RGB'))
          outside_changed = np.any(roundtrip != original, axis=2) & (allowed == 0)
          if np.any(outside_changed):
              raise SystemExit(f'Forbidden changes outside repair mask: {int(outside_changed.sum())}')
          inside_changed = np.any(roundtrip != original, axis=2) & (allowed != 0)
          if not np.any(inside_changed):
              raise SystemExit('Repair mask produced no changes')
          print(f'OK: center repair changed {int(inside_changed.sum())} pixels; 0 outside.')
          PY

      - name: Remove temporary workflow and commit asset only
        run: |
          rm .github/workflows/surgical-cassette-center-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/looper-ui/faceplate.webp .github/workflows/surgical-cassette-center-repair.yml
          git commit -m "Blend cassette center repair into native plastic"
          git push origin HEAD:fix/surgical-faceplate-digital-cleanup
