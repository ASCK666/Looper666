# temporary validation bridge for cassette reel-housing alignment
name: Cassette cutover temp

on:
  push:
    branches:
      - feat/cassette-layer-extraction
    paths:
      - .github/workflows/cassette-cutover-temp.yml
  pull_request:
    branches:
      - docs/cassette-layered-architecture

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cassette-layer-extraction
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow numpy opencv-python-headless playwright
          python -m playwright install --with-deps chromium

      - name: Realign cassette reel housings to historic axes
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFilter
          import numpy as np
          import cv2
          import hashlib

          asset_path = Path('assets/looper-ui/cassette/cassette-static.webp')
          before = asset_path.read_bytes()
          before_sha = hashlib.sha256(before).hexdigest()

          src = Image.open(asset_path).convert('RGBA')
          assert src.size == (598, 355), src.size
          src_arr = np.array(src)
          h, w = src_arr.shape[:2]
          yy, xx = np.mgrid[0:h, 0:w]

          # Historical reel axes in cassette-static crop coordinates.
          target_centers = [(172.0, 149.0), (418.0, 149.0)]
          # Measured visual centres of the current generated housings.
          visual_centers = [(175.5, 159.0), (415.5, 159.0)]
          offsets = [(-3.5, -10.0), (2.5, -10.0)]

          rgb = src_arr[..., :3].copy()
          alpha = src_arr[..., 3].copy()

          # Remove only the old annular housing/mechanical-surround region.
          for vcx, vcy in visual_centers:
              rr = np.sqrt((xx - vcx) ** 2 + (yy - vcy) ** 2)
              remove_mask = ((rr >= 43) & (rr <= 69) & (alpha > 0)).astype(np.uint8) * 255
              rgb = cv2.inpaint(rgb, remove_mask, 5, cv2.INPAINT_TELEA)

          base = Image.fromarray(np.dstack([rgb, alpha]).astype(np.uint8), 'RGBA')
          original = src.copy()

          # Reinsert the original annuli at the historic axes.
          for (vcx, vcy), (dx, dy) in zip(visual_centers, offsets):
              dist = np.sqrt((xx - vcx) ** 2 + (yy - vcy) ** 2)
              hard = np.zeros((h, w), dtype=np.uint8)
              hard[(dist >= 41) & (dist <= 70) & (alpha > 0)] = 255
              annulus = Image.fromarray(hard, 'L').filter(ImageFilter.GaussianBlur(1.2))

              patch = Image.new('RGBA', src.size, (0, 0, 0, 0))
              patch.paste(original, (round(dx), round(dy)))
              moved_mask = Image.new('L', src.size, 0)
              moved_mask.paste(annulus, (round(dx), round(dy)))
              base = Image.composite(patch, base, moved_mask)

          # Keep the exact 94x94 reel apertures locked to the historical axes.
          final_alpha = base.getchannel('A')
          draw = ImageDraw.Draw(final_alpha)
          for cx, cy in target_centers:
              draw.ellipse((int(cx-47), int(cy-47), int(cx+46), int(cy+46)), fill=0)
          base.putalpha(final_alpha)

          # Preserve the current production encoding class.
          base.save(asset_path, 'WEBP', lossless=False, quality=90, method=6)

          after = asset_path.read_bytes()
          assert after != before
          check = Image.open(asset_path).convert('RGBA')
          assert check.size == (598, 355), check.size

          # Verify the aperture centres themselves are exactly historical.
          a = np.array(check)[..., 3]
          for cx, cy in [(172,149),(418,149)]:
              assert a[cy, cx] == 0, (cx, cy, a[cy, cx])
              assert a[cy-45:cy+46, cx-45:cx+46].min() == 0

          print('before sha256:', before_sha)
          print('after sha256 :', hashlib.sha256(after).hexdigest())
          print('after bytes  :', len(after))
          PY

      - name: Lock absolute historic reel centres in browser test
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/asset_render.py')
          text = path.read_text()
          marker = "historic reel centres stay locked to the cassette asset axes"
          assert marker not in text
          needle = "        centers_large=reel_centers()\n"
          replacement = """        centers_large=reel_centers()
        # historic reel centres stay locked to the cassette asset axes
        expected_centers=[(648/1536,249/1024),(894/1536,249/1024)]
        assert all(abs(a-b)<.001 for pair_a,pair_b in zip(centers_large,expected_centers) for a,b in zip(pair_a,pair_b)), (centers_large,expected_centers)
"""
          assert needle in text
          path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Validate focused cassette checks
        run: |
          python tests/resource_paths.py
          python tests/assets_health.py
          python tests/css_health.py
          python tests/css_layout.py
          python tests/asset_render.py
          git diff --check

      - name: Upload STOP PLAY mobile proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cassette-alignment-preview
          path: test-artifacts/*.png
          if-no-files-found: ignore

      - name: Commit successful alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/looper-ui/cassette/cassette-static.webp tests/asset_render.py
          git commit -m 'Align cassette reel housings to historic axes'
          git push origin HEAD:feat/cassette-layer-extraction
