# validation trigger: cassette label occlusion
name: Cassette label occlusion temp

on:
  pull_request:
    branches:
      - docs/cassette-layered-architecture

permissions:
  contents: write

jobs:
  label-occlusion:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cassette-layer-extraction
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow numpy opencv-python-headless playwright
          python -m playwright install --with-deps chromium

      - name: Build sticker occlusion layer
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import cv2
          import hashlib
          import numpy as np
          import re

          root = Path('.')
          source_path = root / 'assets/looper-ui/cassette/cassette-static.webp'
          label_path = root / 'assets/looper-ui/cassette/cassette-label-occlusion.webp'
          css_path = root / 'assets/looper-ui/overlay.css'
          alignment_test_path = root / 'tests/cassette_alignment.py'
          render_test_path = root / 'tests/asset_render.py'

          source_before = source_path.read_bytes()
          source_sha = hashlib.sha256(source_before).hexdigest()
          assert source_sha == 'c5dd70a125e77b220d454e8b822a6fac0b18459674a3c852ec7bc61053f50db7', source_sha

          source = Image.open(source_path).convert('RGB')
          assert source.size == (598, 355), source.size
          sticker = source.crop((73, 52, 507, 98))
          assert sticker.size == (434, 46), sticker.size
          arr = np.array(sticker)

          mask = np.zeros((46, 434), np.uint8)
          left = np.array([[48,30],[68,27],[117,27],[139,34],[139,46],[40,46]], np.int32)
          right = np.array([[277,34],[297,27],[350,27],[372,32],[389,46],[268,46]], np.int32)
          cv2.fillPoly(mask, [left, right], 255)
          cleaned = cv2.inpaint(arr, mask, 5, cv2.INPAINT_TELEA)
          Image.fromarray(cleaned).save(label_path, 'WEBP', lossless=True, quality=100, method=6)
          label_sha = hashlib.sha256(label_path.read_bytes()).hexdigest()
          assert hashlib.sha256(source_path.read_bytes()).hexdigest() == source_sha

          css = css_path.read_text()
          marker = '/* Cassette label occlusion: sticker plate above tape, below dynamic title. */'
          assert marker not in css
          css += '''\n\n/* Cassette label occlusion: sticker plate above tape, below dynamic title. */\n#looper.asset-ui::after{\n  content:"";\n  position:absolute;\n  z-index:8;\n  left:35.7421875%;\n  top:14.84375%;\n  width:28.2552083333%;\n  height:4.4921875%;\n  pointer-events:none;\n  background:url("./cassette/cassette-label-occlusion.webp") 0 0/100% 100% no-repeat;\n}\n'''
          css_path.write_text(css)

          test = alignment_test_path.read_text()
          assert "LABEL_ASSET =" not in test
          test = test.replace(
              "ASSET = ROOT / 'assets/looper-ui/cassette/cassette-static.webp'",
              "ASSET = ROOT / 'assets/looper-ui/cassette/cassette-static.webp'\nLABEL_ASSET = ROOT / 'assets/looper-ui/cassette/cassette-label-occlusion.webp'"
          )
          test = test.replace(
              "EXPECTED_ASSET_SHA256 = 'c5dd70a125e77b220d454e8b822a6fac0b18459674a3c852ec7bc61053f50db7'",
              "EXPECTED_ASSET_SHA256 = 'c5dd70a125e77b220d454e8b822a6fac0b18459674a3c852ec7bc61053f50db7'\nEXPECTED_LABEL_SHA256 = '%s'" % label_sha
          )
          needle = "digest = hashlib.sha256(ASSET.read_bytes()).hexdigest()\nassert digest == EXPECTED_ASSET_SHA256, (digest, EXPECTED_ASSET_SHA256)\n\nprint('OK: cassette asset checksum and reel axes are locked to historic centres')"
          replacement = """digest = hashlib.sha256(ASSET.read_bytes()).hexdigest()
assert digest == EXPECTED_ASSET_SHA256, (digest, EXPECTED_ASSET_SHA256)

label_digest = hashlib.sha256(LABEL_ASSET.read_bytes()).hexdigest()
assert label_digest == EXPECTED_LABEL_SHA256, (label_digest, EXPECTED_LABEL_SHA256)

label_marker = '/* Cassette label occlusion: sticker plate above tape, below dynamic title. */'
assert label_marker in css
label_tail = css[css.rfind(label_marker):]
label_layer = re.search(
    r'#looper\\.asset-ui::after\\{\\s*content:\"\";\\s*position:absolute;\\s*z-index:8;\\s*'
    r'left:35\\.7421875%;\\s*top:14\\.84375%;\\s*width:28\\.2552083333%;\\s*height:4\\.4921875%;',
    label_tail,
    re.S,
)
assert label_layer
assert 'cassette-label-occlusion.webp' in label_tail
print('OK: cassette/reel axes and sticker occlusion layer are locked to canonical geometry')"""
          assert needle in test
          alignment_test_path.write_text(test.replace(needle, replacement))

          render = render_test_path.read_text()
          assert "labelPlate:" not in render
          render = render.replace(
              "const layer=getComputedStyle(glow);",
              "const layer=getComputedStyle(glow);\n          const labelPlate=getComputedStyle(looper,'::after');\n          const labelText=getComputedStyle(document.querySelector('.asset-cassette-label-readout'));"
          )
          render = render.replace(
              "cassetteLayer:[layer.backgroundColor,layer.backgroundImage,layer.boxShadow,layer.filter,layer.mixBlendMode,layer.opacity],",
              "cassetteLayer:[layer.backgroundColor,layer.backgroundImage,layer.boxShadow,layer.filter,layer.mixBlendMode,layer.opacity],\n            labelPlate:[labelPlate.backgroundImage,labelPlate.zIndex,labelText.zIndex,parseFloat(labelPlate.left),parseFloat(labelPlate.top),parseFloat(labelPlate.width),parseFloat(labelPlate.height)],"
          )
          render = render.replace(
              "assert info['cassetteLayer'][2:]==['none','none','normal','1'], info['cassetteLayer']",
              "assert info['cassetteLayer'][2:]==['none','none','normal','1'], info['cassetteLayer']\n        assert 'cassette-label-occlusion.webp' in info['labelPlate'][0], info['labelPlate']\n        assert info['labelPlate'][1:3]==['8','9'], info['labelPlate']\n        expected_plate=[549,152,434,46]\n        assert all(abs(a-b)<1 for a,b in zip(info['labelPlate'][3:],expected_plate)), (info['labelPlate'],expected_plate)"
          )
          render_test_path.write_text(render)

          print('cassette static sha256:', source_sha)
          print('label occlusion sha256:', label_sha)
          print('label occlusion bytes:', label_path.stat().st_size)
          PY

      - name: Validate focused cassette checks
        run: |
          python tests/cassette_alignment.py
          python tests/resource_paths.py
          python tests/assets_health.py
          python tests/css_health.py
          python tests/css_layout.py
          python tests/asset_render.py
          git diff --check

      - name: Build label proof crops
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          artifacts = Path('test-artifacts')
          for src_name, out_name in [('looper-render.png','cassette-label-stop-zoom.png'),('looper-reels-playing.png','cassette-label-play-zoom.png')]:
              src = artifacts / src_name
              if src.exists():
                  im = Image.open(src)
                  im.crop((530,135,1000,215)).save(artifacts / out_name)
          PY

      - name: Upload label proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cassette-label-occlusion-preview
          path: test-artifacts/*.png
          if-no-files-found: ignore

      - name: Commit validated label occlusion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/looper-ui/cassette/cassette-label-occlusion.webp assets/looper-ui/overlay.css tests/cassette_alignment.py tests/asset_render.py
          git commit -m 'Occlude cassette tape beneath track label'
          git push origin HEAD:feat/cassette-layer-extraction
