# validation bridge: complete seven-part payload
name: Cassette cutover temp

on:
  push:
    branches:
      - feat/cassette-layer-extraction
    paths:
      - .github/workflows/cassette-cutover-temp.yml
  pull_request:
    branches:
      - docs/cassette-layered-architecture

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cassette-layer-extraction
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Build layered cassette cutover
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import shutil

          root = Path('.')
          payload_dir = root / 'assets/looper-ui/cassette/.payload'
          parts = sorted(payload_dir.glob('cassette-static.part*'))
          assert len(parts) == 7, [p.name for p in parts]
          encoded = ''.join(p.read_text().strip() for p in parts)
          assert len(encoded) == 45528, len(encoded)
          data = base64.b64decode(encoded, validate=True)
          assert len(data) == 34144, len(data)
          digest = hashlib.sha256(data).hexdigest()
          expected = '81b39135f0c969697da8ec73ea598a66a0eae11894737383062eb32e3b892e0e'
          assert digest == expected, (digest, expected)
          asset = root / 'assets/looper-ui/cassette/cassette-static.webp'
          asset.write_bytes(data)
          shutil.rmtree(payload_dir)

          css_path = root / 'assets/looper-ui/overlay.css'
          css = css_path.read_text()
          marker = '/* Layered cassette cutover: static cabin/cassette layer + exact faceplate reel crops. */'
          assert marker not in css
          css += '''\n\n/* Layered cassette cutover: static cabin/cassette layer + exact faceplate reel crops. */\n#looper.asset-ui .asset-cassette-glow{\n  left:30.9895833333%;\n  top:9.765625%;\n  width:38.9322916667%;\n  height:34.66796875%;\n  border-radius:0;\n  background-image:url("./cassette/cassette-static.webp");\n  background-size:100% 100%;\n  background-position:0 0;\n  background-repeat:no-repeat;\n}\n#looper.asset-ui .asset-cassette-glow::before,\n#looper.asset-ui .asset-cassette-glow::after{\n  top:28.7323943662%;\n  width:15.7190635452%;\n  opacity:1;\n}\n#looper.asset-ui .asset-cassette-glow::before{left:20.9030100334%}\n#looper.asset-ui .asset-cassette-glow::after{left:62.0401337793%}\n'''
          css_path.write_text(css)

          test_path = root / 'tests/asset_render.py'
          test = test_path.read_text()
          test = test.replace(
              "assert info['reelStopped']==['paused','paused','0','0'], info['reelStopped']",
              "assert info['reelStopped'][0:2]==['paused','paused'], info['reelStopped']\n        assert all(float(v)>.5 for v in info['reelStopped'][2:4]), info['reelStopped']"
          )
          test = test.replace(
              "assert info['cassetteLayer']==['rgba(0, 0, 0, 0)','none','none','none','normal','1'], info['cassetteLayer']",
              "assert info['cassetteLayer'][0]=='rgba(0, 0, 0, 0)', info['cassetteLayer']\n        assert 'cassette-static.webp' in info['cassetteLayer'][1], info['cassetteLayer']\n        assert info['cassetteLayer'][2:]==['none','none','normal','1'], info['cassetteLayer']"
          )
          needle = "centers_small=reel_centers()\n        assert all(abs(a-b)<.004 for pair_a,pair_b in zip(centers_large,centers_small) for a,b in zip(pair_a,pair_b)), (centers_large,centers_small)\n        page.set_viewport_size({'width':1536,'height':1200})"
          replacement = "centers_small=reel_centers()\n        assert all(abs(a-b)<.004 for pair_a,pair_b in zip(centers_large,centers_small) for a,b in zip(pair_a,pair_b)), (centers_large,centers_small)\n        page.set_viewport_size({'width':390,'height':844})\n        page.wait_for_timeout(100)\n        centers_phone=reel_centers()\n        assert all(abs(a-b)<.004 for pair_a,pair_b in zip(centers_large,centers_phone) for a,b in zip(pair_a,pair_b)), (centers_large,centers_phone)\n        page.locator('#looper').screenshot(path=str(ARTIFACTS/'looper-mobile-stop.png'))\n        page.set_viewport_size({'width':1536,'height':1200})"
          assert needle in test
          test = test.replace(needle, replacement)
          test = test.replace(
              "parseFloat(getComputedStyle(document.querySelector('.asset-cassette-glow'),'::before').opacity) < .01",
              "parseFloat(getComputedStyle(document.querySelector('.asset-cassette-glow'),'::before').opacity) > .5"
          )
          test = test.replace(
              "assert stopped[0:2]==['paused','paused'] and stopped[2]<.01 and stopped[3]<.01 and stopped[4]==1, stopped",
              "assert stopped[0:2]==['paused','paused'] and stopped[2]>.5 and stopped[3]>.5 and stopped[4]==1, stopped"
          )
          test = test.replace(
              "print('OK: faceplate and cassette body stay fixed; exact faceplate reel crops visibly rotate with PLAY/STOP, speed and responsive alignment')",
              "print('OK: layered cassette STOP stays visible while exact faceplate reel crops rotate with PLAY/STOP, speed and responsive alignment')"
          )
          test_path.write_text(test)

          readme_path = root / 'assets/looper-ui/cassette/README.md'
          readme = readme_path.read_text()
          readme += '''\n\n## First runtime cutover\n\nThe first runtime cutover intentionally uses one static `cassette-static.webp` layer for the cabin/cassette materials while retaining the already-calibrated exact reel crops from `faceplate.webp`. This keeps PLAY/STOP and speed ownership unchanged while STOP/PLAY/mobile parity is validated. Separate lossless reel files remain a later asset-only follow-up after this runtime gate.\n'''
          readme_path.write_text(readme)
          PY

      - name: Validate focused project checks
        run: |
          python tests/resource_paths.py
          python tests/assets_health.py
          python tests/css_health.py
          python tests/css_layout.py
          python tests/asset_render.py
          git diff --check

      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cassette-cutover-preview
          path: test-artifacts/*.png
          if-no-files-found: ignore

      - name: Commit successful cutover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/looper-ui/cassette assets/looper-ui/overlay.css tests/asset_render.py
          git commit -m 'Cut over cassette to layered static bay'
          git push origin HEAD:feat/cassette-layer-extraction
