name: Quick cassette shell retouch

on:
  pull_request:
    branches:
      - feat/cassette-reel-animation

permissions:
  contents: write

jobs:
  retouch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cassette-shell-label-retouch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Build bounded retouch candidate
        id: retouch
        run: |
          current=$(git hash-object assets/looper-ui/faceplate.webp)
          if [ "$current" != "b40f4620595fd56a9365a99bfdafaa40018acbe1" ]; then
            echo "Faceplate already retouched; skipping rebuild."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "built=true" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import cv2
          import numpy as np
          import json

          root=Path.cwd()
          src=root/'assets/looper-ui/faceplate.webp'
          out=root/'test-artifacts'
          out.mkdir(exist_ok=True)

          before=np.array(Image.open(src).convert('RGB'))
          assert before.shape==(1024,1536,3), before.shape
          h,w=before.shape[:2]
          yy,xx=np.mgrid[:h,:w]
          allowed=np.zeros((h,w),dtype=bool)

          # 1) White cassette label: remove only the baked handwriting.
          label_allowed=np.zeros((h,w),dtype=bool)
          label_allowed[146:196,655:905]=True
          allowed |= label_allowed
          gray=cv2.cvtColor(before,cv2.COLOR_RGB2GRAY)
          text_mask=np.zeros((h,w),dtype=np.uint8)
          roi=gray[150:193,665:895]
          dark=(roi<138).astype(np.uint8)*255
          dark=cv2.dilate(dark,np.ones((3,3),np.uint8),iterations=1)
          text_mask[150:193,665:895]=dark
          text_mask[~label_allowed]=0
          bgr=cv2.cvtColor(before,cv2.COLOR_RGB2BGR)
          inpainted=cv2.inpaint(bgr,text_mask,7,cv2.INPAINT_TELEA)
          smooth_mask=cv2.dilate(text_mask,np.ones((11,11),np.uint8),iterations=1)
          smooth_mask=cv2.GaussianBlur(smooth_mask,(0,0),3.0).astype(np.float32)/255.0
          smooth_mask[~label_allowed]=0
          blurred=cv2.GaussianBlur(inpainted,(0,0),2.2)
          label_mix=(inpainted.astype(np.float32)*(1-smooth_mask[...,None]*0.78)+
                     blurred.astype(np.float32)*(smooth_mask[...,None]*0.78))
          working=cv2.cvtColor(np.clip(label_mix,0,255).astype(np.uint8),cv2.COLOR_BGR2RGB).astype(np.float32)

          # 2) Central shell haze: local luminance/clarity correction only.
          cx,cy=(690+855)/2,(185+305)/2
          rx,ry=(855-690)/2,(305-185)/2
          d=((xx-cx)/rx)**2+((yy-cy)/ry)**2
          haze=np.clip(1.25-d,0,1)**1.7
          haze_allowed=d<=1.25
          allowed |= haze_allowed
          orig=working.copy()
          target=(orig-32.0)*1.06+32.0
          target*=0.78
          working=orig*(1-haze[...,None]*0.72)+target*(haze[...,None]*0.72)
          base=np.clip(working,0,255).astype(np.uint8)
          blur=cv2.GaussianBlur(base,(0,0),1.2)
          sharp=np.clip(base.astype(np.float32)*1.25-blur.astype(np.float32)*0.25,0,255)
          working=working*(1-haze[...,None]*0.35)+sharp*(haze[...,None]*0.35)

          # 3) Restore wound-tape continuity around both reels from existing pixels.
          tape_total=np.zeros((h,w),dtype=np.float32)
          for cx,cy in ((648.0,249.0),(893.5,249.0)):
              r=np.sqrt((xx-cx)**2+(yy-cy)**2)
              inner,outer=56.0,108.0
              ramp_in=np.clip((r-inner)/8.0,0,1)
              ramp_out=np.clip((outer-r)/12.0,0,1)
              tape=np.minimum(ramp_in,ramp_out)
              tape *= (yy<315)
              tape_total=np.maximum(tape_total,tape)
              allowed |= ((r>=inner)&(r<=outer)&(yy<315))
          working *= (1-0.22*tape_total[...,None])

          candidate=np.clip(np.rint(working),0,255).astype(np.uint8)
          candidate[~allowed]=before[~allowed]
          candidate_path=out/'faceplate-candidate.webp'
          Image.fromarray(candidate,'RGB').save(candidate_path,'WEBP',lossless=True,quality=100,method=6)
          decoded=np.array(Image.open(candidate_path).convert('RGB'))
          changed=np.any(decoded!=before,axis=2)
          outside=changed & ~allowed
          assert decoded.shape==before.shape
          assert int(outside.sum())==0, int(outside.sum())

          crop=(470,120,1070,395)
          Image.fromarray(before,'RGB').crop(crop).save(out/'cassette-before.png')
          Image.fromarray(decoded,'RGB').crop(crop).save(out/'cassette-after.png')
          Image.fromarray((allowed.astype(np.uint8)*255),'L').crop(crop).save(out/'cassette-allowed-mask.png')
          stats={
            'geometry':[w,h],
            'changed_pixels':int(changed.sum()),
            'outside_allowed_pixels':int(outside.sum()),
            'label_text_mask_pixels':int((text_mask>0).sum()),
            'allowed_pixels':int(allowed.sum()),
            'candidate_bytes':candidate_path.stat().st_size,
          }
          (out/'retouch-stats.json').write_text(json.dumps(stats,indent=2))
          print(json.dumps(stats,indent=2))
          PY
      - name: Integrate validated faceplate
        if: steps.retouch.outputs.built == 'true'
        run: |
          cp test-artifacts/faceplate-candidate.webp assets/looper-ui/faceplate.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/looper-ui/faceplate.webp
          git commit -m "fix: smooth cassette shell and clear baked label"
          git push origin HEAD:fix/cassette-shell-label-retouch
      - uses: actions/upload-artifact@v4
        if: steps.retouch.outputs.built == 'true'
        with:
          name: cassette-shell-retouch
          path: test-artifacts/*
