name: Quick cassette motion

on:
  pull_request:
    branches:
      - fix/html-transparent-readouts

jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Verify reel motion changes frames
        run: |
          python - <<'PY'
          from pathlib import Path
          import contextlib, http.server, socketserver, threading
          from playwright.sync_api import sync_playwright

          root=Path.cwd()
          out=root/'test-artifacts'
          out.mkdir(exist_ok=True)

          class Quiet(http.server.SimpleHTTPRequestHandler):
              def log_message(self,*_): pass

          with contextlib.ExitStack() as stack:
              handler=lambda *a,**kw: Quiet(*a,directory=str(root),**kw)
              server=socketserver.TCPServer(('127.0.0.1',0),handler)
              stack.callback(server.server_close)
              thread=threading.Thread(target=server.serve_forever,daemon=True)
              thread.start(); stack.callback(server.shutdown)
              port=server.server_address[1]

              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
                  page=browser.new_page(viewport={'width':1536,'height':1200},device_scale_factor=1)
                  page.goto(f'http://127.0.0.1:{port}/index.html',wait_until='networkidle',timeout=30000)
                  page.wait_for_function("window.__SP?.ready === true",timeout=10000)
                  page.evaluate("""() => {
                    deckBuffer=new AudioBuffer({numberOfChannels:1,length:44100,sampleRate:44100});
                    document.getElementById('deckTrack').textContent='motion-test.wav';
                    refreshCassetteUI();
                  }""")
                  page.click('#playBeat')
                  page.wait_for_function("deckSource !== null && document.getElementById('looper').classList.contains('asset-playing')",timeout=5000)
                  page.wait_for_timeout(180)
                  a=page.evaluate("""() => {
                    const g=document.querySelector('.asset-cassette-glow');
                    return [getComputedStyle(g,'::before').transform,getComputedStyle(g,'::after').transform];
                  }""")
                  page.locator('#looper').screenshot(path=str(out/'motion-a.png'))
                  page.wait_for_timeout(520)
                  b=page.evaluate("""() => {
                    const g=document.querySelector('.asset-cassette-glow');
                    return [getComputedStyle(g,'::before').transform,getComputedStyle(g,'::after').transform];
                  }""")
                  page.locator('#looper').screenshot(path=str(out/'motion-b.png'))
                  print('frame A transforms:',a)
                  print('frame B transforms:',b)
                  assert a!=b,(a,b)
                  assert all(x!='none' for x in a+b),(a,b)
                  browser.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cassette-motion-frames
          path: test-artifacts/motion-*.png
