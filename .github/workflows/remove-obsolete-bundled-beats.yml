name: Remove obsolete bundled beats

on:
  push:
    branches:
      - cleanup/remove-obsolete-bundled-beats

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Remove obsolete bundled beat layer') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-obsolete-bundled-beats
          fetch-depth: 0
      - name: Remove obsolete bundled beat layer
        shell: python
        run: |
          from pathlib import Path
          import re

          looper = Path('js/looper.js')
          text = looper.read_text(encoding='utf-8')

          text, n = re.subn(
              r'\nconst DEFAULT_BEATS=\[.*?\n\];\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          assert n == 1, 'DEFAULT_BEATS block not found'

          text, n = re.subn(
              r'\nfunction isBundledBeat\(row\)\{\n  return row\.source==="bundled";\n\}\n',
              '\n',
              text,
              count=1,
          )
          assert n == 1, 'isBundledBeat helper not found'

          old = '''  const folderSource=isFolderBeat(row);\n  const bundledSource=isBundledBeat(row);\n  sm.textContent=bundledSource\n    ? `${row.duration.toFixed(1)} s • INCLUDED • ${row.bpm} BPM • ${row.key}`\n    : folderSource\n    ? `${row.duration?row.duration.toFixed(1):"?"} s • LOCAL LIBRARY`\n    : `${row.duration?row.duration.toFixed(1):"?"} s • USER IMPORT`;'''
          new = '''  const folderSource=isFolderBeat(row);\n  sm.textContent=folderSource\n    ? `${row.duration?row.duration.toFixed(1):"?"} s • LOCAL LIBRARY`\n    : `${row.duration?row.duration.toFixed(1):"?"} s • USER IMPORT`;'''
          assert old in text, 'bundled metadata branch not found'
          text = text.replace(old, new, 1)

          old = '''  if(folderSource||bundledSource){\n    right=document.createElement("span");\n    right.className="trackSource"+(bundledSource?" bundled":"");\n    right.textContent=bundledSource?"IN":"LIB";\n    right.title=bundledSource?"Beat inclus dans l'application":"Beat protégé de la bibliothèque locale";\n  }else{'''
          new = '''  if(folderSource){\n    right=document.createElement("span");\n    right.className="trackSource";\n    right.textContent="LIB";\n    right.title="Beat protégé de la bibliothèque locale";\n  }else{'''
          assert old in text, 'bundled source badge branch not found'
          text = text.replace(old, new, 1)

          text, n = re.subn(r'\n    \.\.\.DEFAULT_BEATS,', '', text, count=1)
          assert n == 1, 'DEFAULT_BEATS merge entry not found'

          old = '''    .sort((a,b)=>{\n      const bundledFirst=Number(isBundledBeat(b))-Number(isBundledBeat(a));\n      if(bundledFirst)return bundledFirst;\n      if(order==="recent")return (b.created||0)-(a.created||0);\n      return a.name.localeCompare(b.name);\n    });'''
          new = '''    .sort((a,b)=>{\n      if(order==="recent")return (b.created||0)-(a.created||0);\n      return a.name.localeCompare(b.name);\n    });'''
          assert old in text, 'bundled-first sorter not found'
          text = text.replace(old, new, 1)

          old = '''  let bytes;\n  if(row.blob){\n    assertLocalFileSize(row.blob,MAX_BEAT_FILE_BYTES,"beat");\n    bytes=await row.blob.arrayBuffer();\n  }else if(row.url){\n    const response=await fetch(row.url,{cache:"force-cache"});\n    if(!response.ok)throw new Error(`Beat inclus indisponible (${response.status})`);\n    bytes=await response.arrayBuffer();\n  }else{\n    throw new Error("Source audio introuvable");\n  }'''
          new = '''  if(!row.blob)throw new Error("Source audio introuvable");\n  assertLocalFileSize(row.blob,MAX_BEAT_FILE_BYTES,"beat");\n  const bytes=await row.blob.arrayBuffer();'''
          assert old in text, 'bundled URL decoder branch not found'
          text = text.replace(old, new, 1)

          looper.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          assert 'READY • 3 INCLUDED BEATS' in html
          html = html.replace('READY • 3 INCLUDED BEATS', 'READY • LOAD LIBRARY OR IMPORT', 1)
          index.write_text(html, encoding='utf-8')

          unit = Path('tests/core_unit.js')
          tests = unit.read_text(encoding='utf-8')
          tests = re.sub(r'^assert\.equal\(evaluate\("DEFAULT_BEATS.*?\n', '', tests, flags=re.M)
          tests = re.sub(r'^assert\.equal\(evaluate\("isBundledBeat.*?\n', '', tests, flags=re.M)
          tests = tests.replace('visibleLibraryRows([{name:\'User\',source:\'user\'},{name:\'Included\',source:\'bundled\'}],\'\',\'name\')[0].source\"),\"bundled\"', 'visibleLibraryRows([{name:\'Zulu\',source:\'user\'},{name:\'Alpha\',source:\'user\'}],\'\',\'name\')[0].name\"),\"Alpha\"')
          tests = tests.replace('utilities, tape counter, bundled beats and WAV export', 'utilities, tape counter, real crate rows and WAV export')
          unit.write_text(tests, encoding='utf-8')

          # The old audio files are intentionally absent already. Keep them absent.
          for rel in [
              'assets/beats/stack-piano-horns-85-asharp-minor.wav',
              'assets/beats/violin-piano-92-bflat-minor.wav',
              'assets/beats/stack-violin-piano-89-c-minor.wav',
          ]:
              p = Path(rel)
              if p.exists():
                  p.unlink()

          # This workflow is a one-shot migration; do not leave another layer behind.
          Path('.github/workflows/remove-obsolete-bundled-beats.yml').unlink()

      - name: Verify obsolete bundled layer is gone
        run: |
          ! grep -R "DEFAULT_BEATS\|source:\"bundled\"\|INCLUDED BEATS\|Beat inclus indisponible" js tests index.html
          node --check js/looper.js
          node tests/core_unit.js
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove obsolete bundled beat layer"
          git push origin HEAD:cleanup/remove-obsolete-bundled-beats
