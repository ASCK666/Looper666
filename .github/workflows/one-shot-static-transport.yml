name: One-shot static transport migration

on:
  push:
    branches:
      - agent/looper-deck-refactor
    paths:
      - .github/workflows/one-shot-static-transport.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/looper-deck-refactor
          fetch-depth: 0

      - name: Move transport into artwork stage
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          source = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'(?P<hint>\s*<div id="cassetteHint" class="cassetteDeckHint">.*?</div>\n)'
              r'(?P<stageclose>\s*</div>\n\s*</div>\n)'
              r'\s*<div class="deckTransport" role="group" aria-label="Transport du Looper">.*?</div>\n',
              re.S,
          )
          match = pattern.search(source)
          if not match:
              raise SystemExit("legacy deck transport block not found")

          transport = '''                      <div class="artworkTransport" role="group" aria-label="Transport du Looper">
                        <button id="prevBeat" class="artworkTransportHit artworkTransportPrev" type="button" aria-label="Beat précédent"></button>
                        <button id="playBeat" class="artworkTransportHit artworkTransportPlay" type="button" aria-label="Lecture"></button>
                        <button id="stopBeat" class="artworkTransportHit artworkTransportStop" type="button" aria-label="Stop"></button>
                        <button id="nextBeat" class="artworkTransportHit artworkTransportNext" type="button" aria-label="Beat suivant"></button>
                        <button id="autoLooperToggle" class="artworkTransportHit artworkTransportAuto" type="button" aria-label="Accélération automatique" aria-pressed="false"></button>
                      </div>
'''
          replacement = match.group("hint") + transport + match.group("stageclose")
          source = source[:match.start()] + replacement + source[match.end():]

          required = [
              'class="artworkTransport"',
              'class="artworkTransportHit artworkTransportPrev"',
              'class="artworkTransportHit artworkTransportPlay"',
              'class="artworkTransportHit artworkTransportStop"',
              'class="artworkTransportHit artworkTransportNext"',
              'class="artworkTransportHit artworkTransportAuto"',
          ]
          for fragment in required:
              if source.count(fragment) != 1:
                  raise SystemExit(f"expected one {fragment!r}, found {source.count(fragment)}")
          if 'class="deckTransport"' in source:
              raise SystemExit("legacy deckTransport markup still present")

          path.write_text(source, encoding="utf-8")

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "move deck transport into static artwork markup"
          git push origin HEAD:agent/looper-deck-refactor
