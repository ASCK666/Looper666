name: One-shot AUTO bridge cleanup

on:
  push:
    branches:
      - agent/looper-deck-refactor
    paths:
      - .github/workflows/one-shot-auto-bridge-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/looper-deck-refactor
          fetch-depth: 0

      - name: Remove hidden AUTO status contract
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("js/looper.js")
          source = path.read_text(encoding="utf-8")
          marker = "function refreshAutoLooperCompact(){"
          start = source.find(marker)
          if start < 0:
              raise SystemExit("refreshAutoLooperCompact not found")
          next_function = source.find("\nfunction ", start + len(marker))
          if next_function < 0:
              raise SystemExit("next top-level function not found")

          block = source[start:next_function]
          original = block
          block = block.replace('  const status=$("autoLooperCompactStatus");\n', '')
          block = block.replace('  if(!btn || !status) return;\n', '  if(!btn) return;\n')
          block = re.sub(r'^\s*status\.textContent=.*?;\n', '', block, flags=re.M)

          if 'autoLooperCompactStatus' in block:
              raise SystemExit("AUTO bridge id still present in refreshAutoLooperCompact")
          if block == original:
              raise SystemExit("refreshAutoLooperCompact was not changed")

          closing = block.rfind("}")
          if closing < 0:
              raise SystemExit("refreshAutoLooperCompact closing brace not found")
          event = (
              '  if(typeof CustomEvent==="function" && typeof window.dispatchEvent==="function"){\n'
              '    window.dispatchEvent(new CustomEvent("sp:auto-looper-state"));\n'
              '  }\n'
          )
          block = block[:closing] + event + block[closing:]
          source = source[:start] + block + source[next_function:]

          if 'autoLooperCompactStatus' in source:
              raise SystemExit("autoLooperCompactStatus still present in looper.js")
          path.write_text(source, encoding="utf-8")

      - name: Commit cleanup
        run: |
          node --check js/looper.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/looper.js
          git diff --cached --check
          git commit -m "replace hidden auto status with state event"
          git push origin HEAD:agent/looper-deck-refactor
