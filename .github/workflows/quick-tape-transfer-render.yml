name: Quick exact reel render

on:
  pull_request:
    branches:
      - fix/html-transparent-readouts

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install chromium
      - name: Verify exact faceplate reels
        run: |
          python - <<'PY'
          from pathlib import Path
          import contextlib, http.server, socketserver, threading
          from PIL import Image, ImageChops, ImageStat
          from playwright.sync_api import sync_playwright

          root=Path.cwd(); out=root/'test-artifacts'; out.mkdir(exist_ok=True)
          class Quiet(http.server.SimpleHTTPRequestHandler):
              def log_message(self,*_): pass

          with contextlib.ExitStack() as stack:
              handler=lambda *a,**kw: Quiet(*a,directory=str(root),**kw)
              server=socketserver.TCPServer(('127.0.0.1',0),handler)
              stack.callback(server.server_close)
              threading.Thread(target=server.serve_forever,daemon=True).start(); stack.callback(server.shutdown)
              port=server.server_address[1]
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
                  page=browser.new_page(viewport={'width':1536,'height':1200},device_scale_factor=1)
                  page_errors=[]; failed=[]
                  page.on('pageerror',lambda err: page_errors.append(str(err)))
                  page.on('requestfailed',lambda req: failed.append(f'{req.url}: {req.failure}'))
                  page.goto(f'http://127.0.0.1:{port}/index.html',wait_until='networkidle',timeout=30000)
                  page.wait_for_function("window.__SP?.ready === true",timeout=10000)
                  page.wait_for_function("document.querySelector('.looper-faceplate')?.naturalWidth === 1536",timeout=10000)
                  page.evaluate("""() => {
                    deckBuffer=new AudioBuffer({numberOfChannels:1,length:44100*8,sampleRate:44100});
                    document.getElementById('deckTrack').textContent='exact-faceplate-reels.wav';
                    refreshCassetteUI();
                  }""")
                  glow=page.locator('.asset-cassette-glow')
                  glow.screenshot(path=str(out/'exact-stop.png'))

                  page.add_style_tag(content="""
                    #looper.asset-ui.asset-playing .asset-cassette-glow::before,
                    #looper.asset-ui.asset-playing .asset-cassette-glow::after {
                      animation-play-state:paused!important;
                      animation-delay:0s!important;
                      opacity:1!important;
                    }
                  """)
                  page.click('#playBeat')
                  page.wait_for_function("deckSource !== null && document.getElementById('looper').classList.contains('asset-playing')",timeout=5000)
                  page.wait_for_timeout(250)
                  assets=page.evaluate("""() => {
                    const g=document.querySelector('.asset-cassette-glow');
                    const l=getComputedStyle(g,'::before');
                    const r=getComputedStyle(g,'::after');
                    return [l.backgroundImage,r.backgroundImage,l.backgroundSize,r.backgroundSize,l.backgroundPosition,r.backgroundPosition];
                  }""")
                  assert 'faceplate.webp' in assets[0] and 'faceplate.webp' in assets[1],assets
                  print('direct crop styles:',assets)
                  glow.screenshot(path=str(out/'exact-zero.png'))

                  stop=Image.open(out/'exact-stop.png').convert('RGB')
                  zero=Image.open(out/'exact-zero.png').convert('RGB')
                  d=ImageChops.difference(stop,zero)
                  stat=ImageStat.Stat(d)
                  mean=sum(stat.mean)/3
                  changed=sum(1 for px in d.getdata() if max(px)>12)
                  print('angle-zero diff mean:',mean,'changed pixels:',changed)
                  assert mean < 3.0,(mean,changed)

                  page.locator('style').last.evaluate('(el)=>el.remove()')
                  page.wait_for_timeout(180)
                  glow.screenshot(path=str(out/'exact-play-a.png'))
                  transforms_a=page.evaluate("""() => {
                    const g=document.querySelector('.asset-cassette-glow');
                    return [getComputedStyle(g,'::before').transform,getComputedStyle(g,'::after').transform];
                  }""")
                  page.wait_for_timeout(340)
                  glow.screenshot(path=str(out/'exact-play-b.png'))
                  transforms_b=page.evaluate("""() => {
                    const g=document.querySelector('.asset-cassette-glow');
                    return [getComputedStyle(g,'::before').transform,getComputedStyle(g,'::after').transform];
                  }""")
                  assert transforms_a!=transforms_b,(transforms_a,transforms_b)
                  page.locator('#looper').screenshot(path=str(out/'exact-looper-play.png'))

                  page.click('#stopBeat')
                  page.wait_for_function("deckSource === null && !document.getElementById('looper').classList.contains('asset-playing')",timeout=3000)
                  page.wait_for_function("parseFloat(getComputedStyle(document.querySelector('.asset-cassette-glow'),'::before').opacity) < .01",timeout=1000)
                  page.locator('#looper').screenshot(path=str(out/'exact-looper-stop.png'))
                  assert not page_errors,page_errors
                  assert not failed,failed
                  browser.close()

          a=Image.open(out/'exact-play-a.png').convert('RGB')
          b=Image.open(out/'exact-play-b.png').convert('RGB')
          diff=ImageChops.difference(a,b)
          bbox=diff.getbbox()
          print('motion diff bbox:',bbox)
          assert bbox is not None
          print('OK: direct faceplate reel crops rotate; cassette body remains baked/static')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-reel-render
          path: test-artifacts/exact-*.png
