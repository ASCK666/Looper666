name: Quick tape transfer render

on:
  pull_request:
    branches:
      - fix/html-transparent-readouts

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install chromium
      - name: Verify tape transfer motion
        run: |
          python - <<'PY'
          from pathlib import Path
          import contextlib, http.server, socketserver, threading
          from PIL import Image, ImageChops
          from playwright.sync_api import sync_playwright

          root=Path.cwd(); out=root/'test-artifacts'; out.mkdir(exist_ok=True)
          class Quiet(http.server.SimpleHTTPRequestHandler):
              def log_message(self,*_): pass

          with contextlib.ExitStack() as stack:
              handler=lambda *a,**kw: Quiet(*a,directory=str(root),**kw)
              server=socketserver.TCPServer(('127.0.0.1',0),handler)
              stack.callback(server.server_close)
              threading.Thread(target=server.serve_forever,daemon=True).start(); stack.callback(server.shutdown)
              port=server.server_address[1]
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
                  page=browser.new_page(viewport={'width':1536,'height':1200},device_scale_factor=1)
                  page.goto(f'http://127.0.0.1:{port}/index.html',wait_until='networkidle',timeout=30000)
                  page.wait_for_function("window.__SP?.ready === true",timeout=10000)
                  page.wait_for_function("document.querySelector('.looper-faceplate')?.naturalWidth === 1536",timeout=10000)
                  page.evaluate("""() => {
                    deckBuffer=new AudioBuffer({numberOfChannels:1,length:44100*8,sampleRate:44100});
                    document.getElementById('deckTrack').textContent='tape-transfer-test.wav';
                    refreshCassetteUI();
                    document.getElementById('looper').style.setProperty('--asset-tape-cycle','4s');
                  }""")
                  glow=page.locator('.asset-cassette-glow')
                  glow.screenshot(path=str(out/'transfer-stop.png'))
                  page.click('#playBeat')
                  page.wait_for_function("deckSource !== null && document.getElementById('looper').classList.contains('asset-playing')",timeout=5000)
                  page.wait_for_timeout(120)

                  def state(label):
                      data=page.evaluate("""() => {
                        const g=document.querySelector('.asset-cassette-glow');
                        const cs=getComputedStyle(g);
                        const l=getComputedStyle(g,'::before');
                        const r=getComputedStyle(g,'::after');
                        return {size:cs.backgroundSize,pos:cs.backgroundPosition,left:l.transform,right:r.transform,bg:cs.backgroundImage};
                      }""")
                      glow.screenshot(path=str(out/f'transfer-{label}.png'))
                      print(label,data)
                      return data

                  a=state('a')
                  page.wait_for_timeout(880)
                  b=state('quarter')
                  page.wait_for_timeout(1000)
                  c=state('half')
                  assert a['size']!=b['size']!=c['size'],(a,b,c)
                  assert a['left']!=b['left']!=c['left'],(a,b,c)
                  assert a['right']!=b['right']!=c['right'],(a,b,c)
                  assert 'repeating-radial-gradient' in a['bg'],a
                  page.click('#stopBeat')
                  page.wait_for_function("deckSource === null && !document.getElementById('looper').classList.contains('asset-playing')",timeout=3000)
                  page.wait_for_function("parseFloat(getComputedStyle(document.querySelector('.asset-cassette-glow'),'::before').opacity) < .01",timeout=1000)
                  stop_style=page.evaluate("""() => {
                    const cs=getComputedStyle(document.querySelector('.asset-cassette-glow'));
                    return [cs.backgroundImage,parseFloat(getComputedStyle(document.querySelector('.asset-cassette-glow'),'::before').opacity),parseFloat(getComputedStyle(document.querySelector('.asset-cassette-glow'),'::after').opacity)];
                  }""")
                  assert stop_style[0]=='none' and stop_style[1]<.01 and stop_style[2]<.01,stop_style
                  browser.close()

          stop=Image.open(out/'transfer-stop.png').convert('RGB')
          play=Image.open(out/'transfer-quarter.png').convert('RGB')
          diff=ImageChops.difference(stop,play)
          px=diff.load(); w,h=stop.size
          circles=[(.302,.493,.0835),(.715,.493,.0835)]
          outside=inside=0
          for y in range(h):
              for x in range(w):
                  if max(px[x,y])<=8: continue
                  xn=(x+.5)/w; yn=(y+.5)/h
                  allowed=any(((xn-cx)/rad)**2+((yn-cy)/(rad*2.103))**2<=1 for cx,cy,rad in circles)
                  if allowed: inside+=1
                  else: outside+=1
          print('changed inside:',inside,'outside:',outside)
          assert inside>1500,inside
          assert outside<150,outside
          print('OK: tape mass transfers only inside the two reel circles')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tape-transfer-render
          path: test-artifacts/transfer-*.png
