name: Quick cassette title render

on:
  pull_request:
    branches:
      - fix/html-transparent-readouts

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Render cassette title
        run: |
          python - <<'PY'
          from pathlib import Path
          import contextlib, http.server, socketserver, threading
          from playwright.sync_api import sync_playwright

          root=Path.cwd()
          out=root/'test-artifacts'
          out.mkdir(exist_ok=True)

          class Quiet(http.server.SimpleHTTPRequestHandler):
              def log_message(self,*_): pass

          with contextlib.ExitStack() as stack:
              handler=lambda *a,**kw: Quiet(*a,directory=str(root),**kw)
              server=socketserver.TCPServer(('127.0.0.1',0),handler)
              stack.callback(server.server_close)
              thread=threading.Thread(target=server.serve_forever,daemon=True)
              thread.start(); stack.callback(server.shutdown)
              port=server.server_address[1]

              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
                  page=browser.new_page(viewport={'width':1536,'height':1200},device_scale_factor=1)
                  page.goto(f'http://127.0.0.1:{port}/index.html',wait_until='networkidle',timeout=30000)
                  page.wait_for_function("window.__SP?.ready === true",timeout=10000)
                  page.wait_for_function("document.querySelector('.looper-faceplate')?.naturalWidth === 1536",timeout=10000)
                  page.evaluate("document.querySelector('.asset-cassette-label-readout').textContent='MIDNIGHT LOOP.wav'")
                  style=page.evaluate("""() => {
                    const cs=getComputedStyle(document.querySelector('.asset-cassette-label-readout'));
                    return {backgroundColor:cs.backgroundColor,backgroundImage:cs.backgroundImage,color:cs.color,border:cs.border,boxShadow:cs.boxShadow};
                  }""")
                  print(style)
                  assert style['backgroundColor']=='rgba(0, 0, 0, 0)', style
                  assert style['backgroundImage']=='none', style
                  assert style['color']=='rgb(0, 0, 0)', style
                  assert style['boxShadow']=='none', style
                  page.locator('#looper').screenshot(path=str(out/'cassette-title-transparent.png'))
                  browser.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cassette-title-transparent
          path: test-artifacts/cassette-title-transparent.png
