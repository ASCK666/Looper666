name: Surgical HTML readout cleanup

on:
  push:
    branches:
      - fix/html-transparent-readouts

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/html-transparent-readouts
          fetch-depth: 0

      - name: Make deck readout backgrounds transparent
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/looper-ui/overlay.css')
          text = path.read_text()
          replacements = {
              '/* Dynamic HTML readouts. Backgrounds are sampled from their exact locations in\n   faceplate.webp rather than using one generic black rectangle. */':
              '/* Dynamic HTML readouts. The cleaned digital panels come directly from\n   faceplate.webp; HTML contributes glyphs only, with transparent backgrounds. */',
              'letter-spacing:.04em;background:#060300}': 'letter-spacing:.04em;background:transparent}',
              'letter-spacing:.03em;background:#100700}': 'letter-spacing:.03em;background:transparent}',
              'letter-spacing:.04em;background:#0b0500}': 'letter-spacing:.04em;background:transparent}',
              'font-size:clamp(7px,1.05vw,17px);background:#0e0500}': 'font-size:clamp(7px,1.05vw,17px);background:transparent}',
              'font-size:clamp(10px,1.85vw,30px);background:#090602}': 'font-size:clamp(10px,1.85vw,30px);background:transparent}',
              'font-size:clamp(10px,1.85vw,30px);background:#070502}': 'font-size:clamp(10px,1.85vw,30px);background:transparent}',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Assert faceplate was not modified
        run: git diff --exit-code HEAD -- assets/looper-ui/faceplate.webp

      - name: Remove temporary workflow and commit CSS only
        run: |
          rm .github/workflows/surgical-html-readout-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/looper-ui/overlay.css .github/workflows/surgical-html-readout-cleanup.yml
          git commit -m "Make Looper digital HTML readouts transparent"
          git push origin HEAD:fix/html-transparent-readouts
