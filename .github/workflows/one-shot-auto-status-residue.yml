name: One-shot AUTO status residue cleanup

on:
  push:
    branches:
      - agent/looper-deck-refactor
    paths:
      - .github/workflows/one-shot-auto-status-residue.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/looper-deck-refactor
          fetch-depth: 0

      - name: Remove stale status assignment
        shell: python
        run: |
          from pathlib import Path

          path = Path("js/looper.js")
          source = path.read_text(encoding="utf-8")
          old = (
              '  status.textContent=autoLooperEnabledState\n'
              '    ? `ON • ${autoLooperLoopCount}/${AUTO_LOOP_BATCH} LOOPS`\n'
              '    : `OFF • +${AUTO_SPEED_INCREMENT_PERCENT}% / ${AUTO_LOOP_BATCH} LOOPS`;\n'
          )
          if source.count(old) != 1:
              raise SystemExit(f"expected one stale status assignment, found {source.count(old)}")
          source = source.replace(old, "", 1)
          start = source.index("function refreshAutoLooperCompact(){")
          end = source.index("\nfunction ", start + 1)
          block = source[start:end]
          if "status" in block or "autoLooperCompactStatus" in block:
              raise SystemExit("legacy AUTO status residue remains in refreshAutoLooperCompact")
          if 'new CustomEvent("sp:auto-looper-state")' not in block:
              raise SystemExit("AUTO state event missing from refreshAutoLooperCompact")
          path.write_text(source, encoding="utf-8")

      - name: Commit cleanup
        run: |
          node --check js/looper.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/looper.js
          git diff --cached --check
          git commit -m "remove stale auto status assignment"
          git push origin HEAD:agent/looper-deck-refactor
