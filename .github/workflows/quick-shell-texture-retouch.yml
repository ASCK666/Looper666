name: Quick cassette shell texture retouch

on:
  pull_request:
    branches:
      - fix/cassette-shell-label-retouch

permissions:
  contents: write

jobs:
  retouch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cassette-shell-texture-retouch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Rebuild central plastic-shell texture once
        id: retouch
        run: |
          current=$(git hash-object assets/looper-ui/faceplate.webp)
          if [ "$current" != "20117915aa554c5f6803f268c6024d9ca926d884" ]; then
            echo "Faceplate no longer matches the PR #84 texture input; skipping rebuild."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "built=true" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import cv2
          import json
          import numpy as np

          root=Path.cwd()
          src=root/'assets/looper-ui/faceplate.webp'
          out=root/'test-artifacts'
          out.mkdir(exist_ok=True)

          before=np.array(Image.open(src).convert('RGB'))
          assert before.shape==(1024,1536,3), before.shape
          base=before.astype(np.float32)
          h,w=before.shape[:2]
          yy,xx=np.mgrid[:h,:w]

          # Texture-only allowed region: central clear-plastic pane. The cleaned
          # white label, printed legend and both reel mechanism disks are excluded.
          cx,cy=770.0,250.0
          rx,ry=232.0,61.0
          d=(np.abs(xx-cx)/rx)**6 + (np.abs(yy-cy)/ry)**4
          influence=np.clip(1.30-d,0,1)**1.05
          influence *= ((yy>=197)&(yy<=308)&(xx>=532)&(xx<=1008))
          for rcx,rcy in ((648.0,249.0),(893.5,249.0)):
              r=np.sqrt((xx-rcx)**2+(yy-rcy)**2)
              influence *= np.clip((r-76.0)/16.0,0,1)
          influence=np.clip(influence,0,1).astype(np.float32)
          allowed=influence>0

          # Rebuild a clearer transparent-plastic base while preserving only the
          # darkest underlying tape/material and strong structural boundaries.
          t=np.clip((yy-197.0)/(308.0-197.0),0,1)
          top=np.array([35.0,30.0,25.0],dtype=np.float32)
          bottom=np.array([23.0,19.0,15.0],dtype=np.float32)
          plane=top[None,None,:]*(1-t[...,None])+bottom[None,None,:]*t[...,None]
          rad=np.clip(((xx-770.0)/240.0)**2,0,1)
          plane *= (0.96+0.04*rad)[...,None]

          low=cv2.GaussianBlur(base,(0,0),5.5)
          lum=.2126*low[:,:,0]+.7152*low[:,:,1]+.0722*low[:,:,2]
          dark=np.clip((10.0-lum)/8.0,0,1)
          gx=cv2.Sobel(lum,cv2.CV_32F,1,0,ksize=3)
          gy=cv2.Sobel(lum,cv2.CV_32F,0,1,ksize=3)
          edge=np.sqrt(gx*gx+gy*gy)
          edge=np.clip((edge-5.0)/20.0,0,1)
          edge=cv2.GaussianBlur(edge,(0,0),1.2)
          keep=np.clip(dark*0.65+edge*0.45,0,0.9)
          target_low=plane*(1-keep[...,None])+low*keep[...,None]
          high=base-low
          target=np.clip(target_low+high*1.60,0,255)

          # Retain/emphasize the faceplate's own fine shell detail and add only
          # tiny deterministic scratch-scale structure; no generated donor image.
          gray=cv2.cvtColor(before,cv2.COLOR_RGB2GRAY).astype(np.float32)
          hp=gray-cv2.GaussianBlur(gray,(0,0),1.0)
          overlay=np.clip(hp,-3,3)*0.22
          rng=np.random.default_rng(666)
          for _ in range(38):
              y=int(rng.integers(200,306)); x0=int(rng.integers(550,940)); length=int(rng.integers(18,100))
              cv2.line(overlay,(x0,y),(min(990,x0+length),y),float(rng.uniform(-1.2,1.5)),1,cv2.LINE_AA)
          for _ in range(20):
              x=int(rng.integers(565,980)); y0=int(rng.integers(205,280)); length=int(rng.integers(10,35))
              cv2.line(overlay,(x,y0),(x,min(305,y0+length)),float(rng.uniform(-.8,1.1)),1,cv2.LINE_AA)
          target=np.clip(target+overlay[...,None]*0.9,0,255)
          rebuilt=base*(1-influence[...,None])+target*influence[...,None]

          # Transfer only high-frequency texture residuals from the already-clear
          # left/right shell areas. This keeps the production source inside the
          # approved faceplate rather than copying pixels from the visual reference.
          donor=[]
          for y0,y1,x0,x1 in ((198,308,500,585),(198,308,955,1040)):
              p=base[y0:y1,x0:x1]
              donor.append(p-cv2.GaussianBlur(p,(0,0),5))
          source=np.concatenate(donor,axis=1)
          tx0,tx1,ty0,ty1=535,1005,198,307
          th,tw=ty1-ty0,tx1-tx0
          tex=np.zeros((th,tw,3),np.float32)
          weight=np.zeros((th,tw,1),np.float32)
          ps,stride=36,26
          win=(0.15+0.85*np.outer(np.hanning(ps),np.hanning(ps))).astype(np.float32)[...,None]
          rng=np.random.default_rng(666)
          for ty in range(0,th-ps+1,stride):
              for tx in range(0,tw-ps+1,stride):
                  sy=int(rng.integers(0,source.shape[0]-ps+1))
                  sx=int(rng.integers(0,source.shape[1]-ps+1))
                  p=source[sy:sy+ps,sx:sx+ps].copy()
                  if rng.random()<.5: p=p[:,::-1]
                  if rng.random()<.5: p=p[::-1]
                  tex[ty:ty+ps,tx:tx+ps]+=p*win
                  weight[ty:ty+ps,tx:tx+ps]+=win
          tex/=np.maximum(weight,1e-5)
          tex=cv2.GaussianBlur(tex,(0,0),.35)
          texture_full=np.zeros_like(rebuilt)
          texture_full[ty0:ty1,tx0:tx1]=tex
          textured=np.clip(rebuilt+texture_full*0.25,0,255)
          textured=rebuilt*(1-influence[...,None])+textured*influence[...,None]

          # Broad clarity pass to make the remaining tape/shell transitions read
          # crisp rather than smeared, with a hard per-channel halo limit.
          blur=cv2.GaussianBlur(textured,(0,0),7.0)
          sharpened=np.clip(textured+0.85*(textured-blur),0,255)
          sharpened=textured+np.clip(sharpened-textured,-10,10)
          final=textured*(1-influence[...,None])+sharpened*influence[...,None]
          final=np.clip(np.rint(final),0,255).astype(np.uint8)

          # Absolute safety boundary after all processing.
          final[~allowed]=before[~allowed]
          output=out/'faceplate-shell-texture.webp'
          Image.fromarray(final,'RGB').save(output,'WEBP',lossless=True,quality=100,method=6)
          decoded=np.array(Image.open(output).convert('RGB'))
          assert decoded.shape==before.shape
          changed=np.any(decoded!=before,axis=2)
          outside=changed & ~allowed
          assert int(outside.sum())==0, int(outside.sum())

          reel_changes={}
          for name,(rcx,rcy) in {'left':(648.0,249.0),'right':(893.5,249.0)}.items():
              r=np.sqrt((xx-rcx)**2+(yy-rcy)**2)
              reel_changes[name]=int((changed & (r<76)).sum())
          assert reel_changes=={'left':0,'right':0}, reel_changes
          assert int((changed & (yy<197)).sum())==0
          assert int((changed & (yy>308)).sum())==0

          crop=(470,120,1070,395)
          Image.fromarray(before,'RGB').crop(crop).save(out/'shell-before.png')
          Image.fromarray(decoded,'RGB').crop(crop).save(out/'shell-after.png')
          Image.fromarray((allowed.astype(np.uint8)*255),'L').crop(crop).save(out/'shell-allowed-mask.png')
          diff=np.max(np.abs(decoded.astype(np.int16)-before.astype(np.int16)),axis=2)
          diff_rgb=np.zeros((h,w,3),dtype=np.uint8)
          diff_rgb[:,:,0]=np.clip(diff*12,0,255).astype(np.uint8)
          Image.fromarray(diff_rgb,'RGB').crop(crop).save(out/'shell-diff.png')
          stats={
              'geometry':[w,h],
              'changed_pixels':int(changed.sum()),
              'allowed_pixels':int(allowed.sum()),
              'outside_allowed_pixels':int(outside.sum()),
              'reel_disk_changes':reel_changes,
              'label_area_changes':int((changed & (yy<197)).sum()),
              'below_shell_changes':int((changed & (yy>308)).sum()),
          }
          (out/'shell-texture-stats.json').write_text(json.dumps(stats,indent=2))
          print(json.dumps(stats,indent=2))
          PY
      - name: Integrate validated texture retouch
        if: steps.retouch.outputs.built == 'true'
        run: |
          cp test-artifacts/faceplate-shell-texture.webp assets/looper-ui/faceplate.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/looper-ui/faceplate.webp
          git commit -m "fix: rebuild cassette shell plastic texture"
          git push origin HEAD:fix/cassette-shell-texture-retouch
      - uses: actions/upload-artifact@v4
        if: steps.retouch.outputs.built == 'true'
        with:
          name: cassette-shell-texture-retouch
          path: test-artifacts/*
