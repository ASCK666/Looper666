name: Quick cassette shell texture browser check

on:
  pull_request:
    branches:
      - fix/cassette-shell-label-retouch

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium test dependency
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Run maintained asset render
        run: python tests/asset_render.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cassette-shell-texture-browser-render
          path: test-artifacts/*.png
          if-no-files-found: error
