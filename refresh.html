<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scratch Practice • Refresh</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080706;color:#e2ad5f;font:14px ui-monospace,SFMono-Regular,Consolas,monospace}main{text-align:center;padding:24px}small{display:block;margin-top:10px;color:#8d7a5e}
</style>
</head>
<body>
<main>RESET DU CACHE…<small>La page va se recharger automatiquement.</small></main>
<script>
(async()=>{
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(reg=>reg.unregister()));
    }
    if("caches" in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(key=>key.startsWith("scratch-practice-")).map(key=>caches.delete(key)));
    }
    if("serviceWorker" in navigator){
      const reg=await navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"});
      await reg.update();
      await navigator.serviceWorker.ready;
    }
  }catch(error){
    console.warn("Scratch Practice cache reset:",error);
  }
  location.replace(`./?fresh=${Date.now()}`);
})();
</script>
</body>
</html>
